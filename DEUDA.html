<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accediendo...</title>

<style>
body{
    margin:0;
    background: linear-gradient(135deg,#0f0f0f,#1c1c1c,#000);
    font-family: Arial, Helvetica, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
    overflow:hidden;
}

/* CONTENEDOR */
.container{
    text-align:center;
    width:400px;
}

/* TITULO */
h1{
    font-size:28px;
    letter-spacing:2px;
    animation: glow 1.5s infinite alternate;
}

/* BARRA */
.progress-box{
    width:100%;
    height:20px;
    background:#222;
    border-radius:20px;
    margin-top:30px;
    overflow:hidden;
    box-shadow:0 0 10px #00f2ff44 inset;
}

.progress{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#00f2ff,#00ff88);
    border-radius:20px;
    box-shadow:0 0 15px #00f2ff;
    transition: width 0.1s linear;
}

/* MENSAJE FINAL */
.final{
    display:none;
    font-size:40px;
    font-weight:bold;
    color:#ff2d2d;
    text-shadow:0 0 20px red;
    animation: zoomIn 0.6s ease forwards;
}

/* ANIMACIONES */
@keyframes glow{
    from{ text-shadow:0 0 5px #00f2ff; }
    to{ text-shadow:0 0 20px #00f2ff; }
}

@keyframes zoomIn{
    from{ transform:scale(0.5); opacity:0; }
    to{ transform:scale(1); opacity:1; }
}

</style>
</head>
<body>

<div class="container">
    <div id="loading">
        <h1>🔐 Conectando al sistema...</h1>
        <p>Reproduciendo contenido seguro...</p>

        <div class="progress-box">
            <div class="progress" id="bar"></div>
        </div>

        <p id="counter">0%</p>
    </div>

    <div class="final" id="finalText">
        ME DEBE 24BS
    </div>
</div>

<script>
let progress = 0;
let bar = document.getElementById("bar");
let counter = document.getElementById("counter");
let loading = document.getElementById("loading");
let finalText = document.getElementById("finalText");

let interval = setInterval(() => {
    progress++;
    bar.style.width = progress + "%";
    counter.innerText = progress + "%";

    if(progress >= 100){
        clearInterval(interval);
        setTimeout(()=>{
            loading.style.display="none";
            finalText.style.display="block";
        },500);
    }
}, 100); // 100ms x 100 = 10 segundos
</script>

</body>
</html>
